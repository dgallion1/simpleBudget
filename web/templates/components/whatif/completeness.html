{{/* Scenario completeness banner. Renders nothing when Findings is empty. */}}
{{define "whatif-completeness"}}
{{if .Findings}}
<div id="whatif-completeness" class="space-y-2 mb-3">
    {{range .Findings}}
    <div class="rounded-md border p-3 text-sm
        {{if eq .Severity 2}}border-negative bg-negative-soft text-negative
        {{else if eq .Severity 1}}border-warning bg-warning-soft text-warning
        {{else}}border-accent bg-accent-soft text-accent{{end}}">
        <div class="flex items-start justify-between gap-3">
            <div class="flex-1">
                <p class="font-semibold">{{.Title}}</p>
                <p class="mt-1 text-body-sm opacity-90">{{.Detail}}</p>
            </div>
            {{if and .FormAnchor .Action}}
            <a href="#{{.FormAnchor}}" class="shrink-0 text-xs font-medium underline hover:no-underline">
                {{.Action}}
            </a>
            {{end}}
        </div>
    </div>
    {{end}}
</div>
{{end}}
{{end}}
