name: Test

# Runs on every pull request, and on master so a green PR that goes stale is
# still caught after it merges. release.yml only fires on v* tags, so before
# this workflow nothing reported on a pull request at all.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A second push to a branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a pinned version. go.mod says `go 1.26` with
      # `toolchain go1.26.6`; release.yml's hardcoded '1.24' only works because
      # the toolchain directive makes Go download 1.26 on the fly. Reading the
      # file keeps CI on whatever the module actually requires.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...

      # Runs as the unprivileged `runner` user, which matters more than it
      # looks: a large group of tests inject write failures by chmod'ing a path
      # read-only, and root ignores permission bits. Under root those tests
      # fail wholesale because the failure they inject never happens.
      # Explicit for the same reason as the race job: the 15-minute job budget
      # and `go test`'s default 10-minute per-package cap are different limits,
      # and only the latter was ever in force.
      - run: go test -timeout 12m ./...

  # Its own job rather than a step in `test`, for the same reason `race` is:
  # a lint failure and a test failure are different problems, and running them
  # in parallel means you see both from one run instead of the first masking
  # the second. Costs no wall-clock time -- jobs run concurrently.
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Pinned, not @latest. staticcheck ships new checks in each release, so
      # @latest can turn CI red on a commit that changed nothing -- the failure
      # then looks like the PR's fault. Bump this deliberately.
      #
      # The Makefile's `static` target runs a bare `staticcheck` off PATH, so
      # a contributor's local version and this one can drift. This is the one
      # that gates.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0 ./...

  # The committed tailwind.css is a build artifact, so it can go stale: a class
  # added to a template without `make css` renders wrong for everyone with no
  # build failure. The Go canary test only checks fixed selectors; this is the
  # byte-for-byte check. Its own job because it needs no Go toolchain — just
  # curl (for the pinned standalone Tailwind CLI) and make.
  css-verify:
    name: css freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: make css-verify

  # Split out because it is an order of magnitude slower than the plain suite
  # (~2 min vs ~20), and a fast red on a compile error or a broken test should
  # not wait behind it. The Makefile draws the same line: `check` excludes the
  # race detector, `check-full` adds it.
  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # -timeout must be set explicitly. The job budget above is 45 minutes,
      # but `go test` applies its own 10-minute cap PER PACKAGE, so without
      # this a single slow package panics with "test timed out" long before
      # the job budget is anywhere near spent — and the run fails for a reason
      # that has nothing to do with the code. internal/handlers/backup is the
      # one that trips it: under -race it has been measured anywhere from 61s
      # to over 600s on these runners depending on contention, against ~150s
      # locally. Keep this below timeout-minutes so a genuinely hung test
      # still surfaces as a Go panic with a stack dump rather than as an
      # opaque job kill.
      - run: go test -race -timeout 40m ./...
