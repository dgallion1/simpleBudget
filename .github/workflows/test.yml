name: Test

# Runs on every pull request, and on master so a green PR that goes stale is
# still caught after it merges. release.yml only fires on v* tags, so before
# this workflow nothing reported on a pull request at all.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A second push to a branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a pinned version. go.mod says `go 1.26` with
      # `toolchain go1.26.6`; release.yml's hardcoded '1.24' only works because
      # the toolchain directive makes Go download 1.26 on the fly. Reading the
      # file keeps CI on whatever the module actually requires.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...

      # Runs as the unprivileged `runner` user, which matters more than it
      # looks: a large group of tests inject write failures by chmod'ing a path
      # read-only, and root ignores permission bits. Under root those tests
      # fail wholesale because the failure they inject never happens.
      - run: go test ./...

  # Split out because it is an order of magnitude slower than the plain suite
  # (~2 min vs ~20), and a fast red on a compile error or a broken test should
  # not wait behind it. The Makefile draws the same line: `check` excludes the
  # race detector, `check-full` adds it.
  race:
    name: race detector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
