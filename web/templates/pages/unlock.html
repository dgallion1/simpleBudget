{{define "unlock"}}
<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock - Financial Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Tailwind CSS (vendored static build, see tailwind.config.js for the regen command) -->
    <link href="/static/css/tailwind.css" rel="stylesheet">

    <!-- Theme initialization: this unlock page does not use layouts/base.html
         (it renders before storage is unlocked), so it carries its own copy
         of the same pre-first-paint flash-prevention bootstrap (U7 inline-
         script allowance, budget2-repo-relative: one of the <=5 sitewide). -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors duration-200">
    <div class="w-full max-w-sm px-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <!-- Lock Icon -->
            <div class="flex justify-center mb-4">
                <div class="p-3 bg-accent-soft rounded-full">
                    <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>

            <h1 class="text-xl font-semibold text-center text-gray-800 dark:text-gray-100 mb-2">
                Storage Locked
            </h1>
            <p id="unlock-description" class="text-sm text-center text-gray-600 dark:text-gray-400 mb-6">
                Enter your encryption password to unlock
            </p>

            <!-- Password unlock form (default) -->
            <form id="unlock-form" class="space-y-4">
                <div id="password-field">
                    <input type="password" name="password" id="password" required autofocus
                        placeholder="Password"
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-accent focus:border-transparent">
                </div>

                <div id="error-message" class="hidden text-sm text-negative text-center"></div>

                <button type="submit" id="unlock-btn"
                    class="w-full px-4 py-2 bg-accent-strong text-white font-medium rounded-lg hover:bg-accent-strong transition-colors focus:ring-2 focus:ring-accent focus:ring-offset-2 dark:focus:ring-offset-gray-800">
                    Unlock
                </button>
            </form>

            <!-- Method indicator (shown for non-password methods) -->
            <div id="method-indicator" class="hidden mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                <p class="text-body-sm text-center text-gray-600 dark:text-gray-400">
                    Method: <span id="method-name" class="font-medium"></span>
                </p>
            </div>
        </div>

        <p class="text-body-sm text-center text-gray-600 dark:text-gray-400 mt-4">
            Financial Dashboard
        </p>
    </div>

    <script src="/static/js/unlock.js" defer></script>
</body>

</html>
{{end}}
